<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condições | Dra. Carine Petry</title>
<meta name="description" content="Quadros que frequentemente se sobrepõem no mesmo paciente e que, por isso, são avaliados em conjunto.">
<meta name="theme-color" content="#241021">
<link rel="canonical" href="https://carinepetry.com.br/consulta/condicoes/">
<link rel="alternate" hreflang="pt-BR" href="https://carinepetry.com.br/consulta/condicoes/">
<link rel="alternate" hreflang="en" href="https://carinepetry.com.br/en/consulta/condicoes/">
<link rel="alternate" hreflang="x-default" href="https://carinepetry.com.br/consulta/condicoes/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dra. Carine Petry">
<meta property="og:title" content="Condições | Dra. Carine Petry">
<meta property="og:description" content="Quadros que frequentemente se sobrepõem no mesmo paciente e que, por isso, são avaliados em conjunto.">
<meta property="og:url" content="https://carinepetry.com.br/consulta/condicoes/">
<meta property="og:image" content="https://res.cloudinary.com/dlzrfhwin/image/upload/f_auto,q_auto:best,w_1200/v1776164492/WhatsApp_Image_2026-03-12_at_12.24.28_ardzoc.jpg">
<meta property="og:locale" content="pt_BR">

<script>window.CP_PARAMS={"lang":"pt","base":"../../","alt":{"pt":"../../consulta/condicoes/","en":"../../en/consulta/condicoes/"}};window.CP_ASSETS="../../assets/";window.__resources={"./SiteHeader.dc.html":"../../assets/SiteHeader.dc.html","./SiteFooter.dc.html":"../../assets/SiteFooter.dc.html"};</script>
<script src="../../assets/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<script src="../../assets/cp-content.js"></script>
<script src="../../assets/cp-data.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FBF7F4;color:#3A3532;font-family:var(--sans,'Instrument Sans'),-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#8E1348;text-decoration:none}
a:hover{color:#B01755}
::selection{background:#4A1942;color:#FBF7F4}
</style>
</helmet>
<dc-import name="SiteHeader" current="consult" hint-size="100%,0px"></dc-import>
<main>
<section data-screen-label="01 Condições, abertura" style="padding:clamp(128px,14vw,176px) 0 clamp(56px,7vw,88px)">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <nav aria-label="Breadcrumb" style="display:flex;gap:8px;font-size:13px;color:#7A716B"><a href="{{ P.approach }}" style="white-space:nowrap;flex:none;color:#7A716B">{{ ui.nav.consult }}</a><span style="flex:none">/</span><span style="white-space:nowrap;flex:none;color:#241021">{{ ui.nav.conds }}</span></nav>
    <div style="margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:32px 64px;align-items:end">
      <h1 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(3rem,6vw,5.75rem);line-height:0.98;letter-spacing:-0.024em;color:#241021">{{ c.title }}</h1>
      <p style="margin:0;max-width:44ch;font-size:19px;line-height:1.6;text-wrap:pretty">{{ c.lead }}</p>
    </div>
    <div style="margin-top:48px;display:inline-flex;padding:4px;border-radius:999px;background:#F4EEE9">
      <a href="{{ P.approach }}" style="display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;white-space:nowrap;color:#241021;font-size:14px;font-weight:500" style-hover="background:#EDE5DF;color:#241021">{{ ui.nav.approach }}</a>
      <a href="{{ P.areas }}" style="display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;white-space:nowrap;color:#241021;font-size:14px;font-weight:500" style-hover="background:#EDE5DF;color:#241021">{{ ui.nav.areas }}</a>
      <a href="{{ P.conds }}" style="display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;white-space:nowrap;background:#241021;color:#FBF7F4;font-size:14px;font-weight:500">{{ ui.nav.conds }}</a>
    </div>
  </div>
</section>

<section data-screen-label="02 Índice" style="padding:0 0 clamp(96px,12vw,160px)">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px">
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="11">
        <div data-reveal="">
          <sc-if value="{{ i.link }}" hint-placeholder-val="{{ false }}">
            <a href="{{ i.href }}" style="display:flex;flex-direction:column;height:100%;min-height:240px;padding:28px;border-radius:24px;background:#241021;color:#F0E7E2;transition:transform .5s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-4px);color:#F0E7E2">
              <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;color:#A8577A">{{ i.n }}</span>
              <h2 style="margin:auto 0 0;padding-top:32px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:1.75rem;line-height:1.12;color:#FBF7F4">{{ i.t }}</h2>
              <span style="margin-top:18px;font-size:14px;font-weight:500;color:#E7BCD0">{{ ui.dedicated }} ›</span>
            </a>
          </sc-if>
          <sc-if value="{{ i.plain }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-direction:column;height:100%;min-height:240px;padding:28px;border-radius:24px;background:#FFFFFF;border:1px solid #EDE5DF">
              <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;color:#A8577A">{{ i.n }}</span>
              <h2 style="margin:auto 0 0;padding-top:32px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:1.75rem;line-height:1.12;color:#241021">{{ i.t }}</h2>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <p style="margin:32px 0 0;max-width:70ch;font-size:14px;line-height:1.6;color:#7A716B">{{ c.note }}</p>
  </div>
</section>

<section data-screen-label="03 CTA" style="background:#241021;color:#F0E7E2;padding:clamp(104px,13vw,176px) 0;text-align:center">
  <div data-reveal="" style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <h2 style="margin:0 auto;max-width:20ch;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(2.5rem,5vw,4.25rem);line-height:1.04;color:#FBF7F4;text-wrap:balance">{{ fc.title }}</h2>
    <a href="{{ P.contact }}" style="display:inline-flex;margin-top:40px;align-items:center;height:52px;padding:0 28px;border-radius:999px;white-space:nowrap;background:#B01755;color:#FFFFFF;font-size:15px;font-weight:500" style-hover="background:#C51E60;color:#FFFFFF">{{ fc.cta }}</a>
  </div>
</section>
</main>
<dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { d: null };
  componentDidMount() {
    const boot = () => { if (!window.CPData) return setTimeout(boot, 30); this.off = CPData.onLang(() => this.load()); this.load(); };
    boot();
  }
  componentWillUnmount() { this.off && this.off(); }
  async load() { const d = await CPData.load(CPData.getLang()); this.setState({ d }, () => CPData.reveal()); }
  renderVals() {
    const { d } = this.state;
    if (!d) return { P: {}, ui: { nav: {} }, c: {}, fc: {} };
    const D = d.dict, P = CPData.PAGES;
    return {
      P, ui: d.ui, c: D.conditions, fc: D.finalCta,
      items: D.conditions.items.map((i, k) => ({ t: i.t, n: String(k + 1).padStart(2, '0'), link: !!i.slug, plain: !i.slug, href: CPData.condHref(i.slug) }))
    };
  }
}
</script>
</body>
</html>
