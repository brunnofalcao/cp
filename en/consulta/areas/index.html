<html lang="en">
<head>

<script>window.CP_PARAMS={"lang":"en","base":"../../../","alt":{"pt":"../../../consulta/areas/","en":"../../../en/consulta/areas/"}};window.CP_ASSETS="../../../assets/";window.__resources={"./SiteHeader.dc.html":"../../../assets/SiteHeader.dc.html","./SiteFooter.dc.html":"../../../assets/SiteFooter.dc.html"};</script>
<script src="../../../assets/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<script src="../../../assets/cp-content.js"></script>
<script src="../../../assets/cp-data.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FBF7F4;color:#3A3532;font-family:var(--sans,'Instrument Sans'),-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#8E1348;text-decoration:none}
a:hover{color:#B01755}
::selection{background:#4A1942;color:#FBF7F4}
</style>
</helmet>
<dc-import name="SiteHeader" current="consult" hint-size="100%,0px"></dc-import>
<main>
<section data-screen-label="01 Áreas, abertura" style="padding:clamp(128px,14vw,176px) 0 clamp(64px,8vw,96px)">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <nav aria-label="Breadcrumb" style="display:flex;gap:8px;font-size:13px;color:#7A716B"><a href="{{ P.approach }}" style="white-space:nowrap;flex:none;color:#7A716B">{{ ui.nav.consult }}</a><span style="flex:none">/</span><span style="white-space:nowrap;flex:none;color:#241021">{{ ui.nav.areas }}</span></nav>
    <div style="margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:32px 64px;align-items:end">
      <h1 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(3rem,6vw,5.75rem);line-height:0.98;letter-spacing:-0.024em;color:#241021">{{ ar.title }}</h1>
      <p style="margin:0;max-width:44ch;font-size:19px;line-height:1.6;text-wrap:pretty">{{ ar.lead }}</p>
    </div>
    <div style="margin-top:48px;display:inline-flex;padding:4px;border-radius:999px;background:#F4EEE9">
      <a href="{{ P.approach }}" style="display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;white-space:nowrap;color:#241021;font-size:14px;font-weight:500" style-hover="background:#EDE5DF;color:#241021">{{ ui.nav.approach }}</a>
      <a href="{{ P.areas }}" style="display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;white-space:nowrap;background:#241021;color:#FBF7F4;font-size:14px;font-weight:500">{{ ui.nav.areas }}</a>
      <a href="{{ P.conds }}" style="display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;white-space:nowrap;color:#241021;font-size:14px;font-weight:500" style-hover="background:#EDE5DF;color:#241021">{{ ui.nav.conds }}</a>
    </div>
  </div>
</section>

<section data-screen-label="02 Quatro eixos" style="padding:0 0 clamp(96px,12vw,160px)">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:20px">
    <sc-for list="{{ areas }}" as="a" hint-placeholder-count="4">
      <a data-reveal="" href="{{ a.href }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));border-radius:32px;overflow:hidden;background:{{ a.bg }};color:{{ a.fg }};transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s" style-hover="transform:translateY(-4px);box-shadow:0 40px 80px -40px rgba(36,16,33,0.35)">
        <div style="order:{{ a.order }};min-height:520px;position:relative;overflow:hidden;background:{{ a.ph }}">
          <img src="{{ a.img }}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ a.pos }};display:block">
        </div>
        <div style="padding:clamp(36px,4.5vw,64px);display:flex;flex-direction:column">
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;color:#A8577A">{{ a.n }}</span>
          <h2 style="margin:clamp(28px,4vw,56px) 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(2.25rem,3.6vw,3.25rem);line-height:1.04;letter-spacing:-0.015em;color:{{ a.head }}">{{ a.t }}</h2>
          <p style="margin:18px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(1.25rem,1.7vw,1.5rem);line-height:1.3;color:{{ a.accent }}">{{ a.h1 }}</p>
          <p style="margin:18px 0 0;max-width:48ch;font-size:16px;line-height:1.65;text-wrap:pretty">{{ a.d }}</p>
          <div style="margin-top:auto;padding-top:32px;display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ a.signals }}" as="s" hint-placeholder-count="3">
              <span style="white-space:nowrap;padding:7px 12px;border-radius:999px;background:{{ a.chip }};font-size:13px">{{ s }}</span>
            </sc-for>
          </div>
          <span style="margin-top:28px;font-size:15px;font-weight:500;color:{{ a.link }}">{{ ar.cta }} ›</span>
        </div>
      </a>
    </sc-for>
  </div>
</section>

<section data-screen-label="03 Condições" style="background:#F4EEE9;padding:clamp(88px,10vw,136px) 0;text-align:center">
  <div data-reveal="" style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <h2 style="margin:0 auto;max-width:22ch;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(2.25rem,3.8vw,3.25rem);line-height:1.08;color:#241021;text-wrap:balance">{{ c.lead }}</h2>
    <a href="{{ P.conds }}" style="display:inline-flex;margin-top:36px;align-items:center;height:52px;padding:0 28px;border-radius:999px;white-space:nowrap;background:#241021;color:#FBF7F4;font-size:15px;font-weight:500" style-hover="background:#4A1942;color:#FBF7F4">{{ ui.seeAll }}</a>
  </div>
</section>
</main>
<dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { d: null };
  componentDidMount() {
    const boot = () => { if (!window.CPData) return setTimeout(boot, 30); this.off = CPData.onLang(() => this.load()); this.load(); };
    boot();
  }
  componentWillUnmount() { this.off && this.off(); }
  async load() { const d = await CPData.load(CPData.getLang()); this.setState({ d }, () => CPData.reveal()); }
  renderVals() {
    const { d } = this.state;
    if (!d) return { P: {}, ui: { nav: {} }, ar: {}, c: {} };
    const D = d.dict, P = CPData.PAGES;
    const areas = D.areasHome.items.map((a, i) => {
      const dark = i % 2 === 1;
      return {
        ...a, n: String(i + 1).padStart(2, '0'), href: CPData.condHref(a.slug), signals: a.signals.split(' · '),
        h1: (d.landing[a.slug] || {}).h1 || '', order: i % 2 ? 2 : 0,
        img: CPData.assets + 'img/area-' + a.slug + '.webp', pos: ({ sam: 'center 45%', sed: 'center 30%', 'covid-longa': 'center 60%', 'medicina-do-sono': 'center 55%' })[a.slug] || 'center',
        bg: dark ? '#241021' : '#FFFFFF', fg: dark ? '#C9B4BF' : '#3A3532', head: dark ? '#FBF7F4' : '#241021',
        accent: dark ? '#E7BCD0' : '#4A1942', chip: dark ? 'rgba(240,231,226,0.08)' : '#F4EEE9', link: dark ? '#FFFFFF' : '#8E1348',
        ph: dark ? '#3A1A34' : '#EDE5DF', sub: dark ? '#C9B4BF' : '#7A716B'
      };
    });
    return { P, ui: d.ui, ar: D.areasHome, c: D.conditions, areas };
  }
}
</script>
</body>
</html>
