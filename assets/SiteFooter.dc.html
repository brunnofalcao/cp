<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
</helmet>
<footer style="background:#1A0B18;color:#C9B4BF;padding:clamp(72px,9vw,112px) 0 40px">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px;padding-bottom:56px;border-bottom:1px solid rgba(240,231,226,0.12)">
      <div>
        <img src="https://res.cloudinary.com/dlzrfhwin/image/upload/f_auto,q_auto:best,w_1000/v1784824334/Logo_-_Footer_Site_-_Carine_Petry_dd7yxf.png" alt="Dra. Carine Petry" style="height:36px;width:auto;display:block">
        <p style="margin:22px 0 0;max-width:44ch;font-size:14px;line-height:1.65">{{ tagline }}</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        <a href="{{ pages.contact }}" style="display:inline-flex;align-items:center;height:44px;padding:0 22px;border-radius:999px;white-space:nowrap;background:#B01755;color:#FFFFFF;font-size:14px;font-weight:500" style-hover="background:#C51E60;color:#FFFFFF">{{ ui.book }}</a>
        <a href="https://wa.me/5561992721947" style="display:inline-flex;align-items:center;height:44px;padding:0 22px;border-radius:999px;white-space:nowrap;border:1px solid rgba(240,231,226,0.22);color:#F0E7E2;font-size:14px;font-weight:500" style-hover="background:rgba(240,231,226,0.06);color:#FFFFFF">WhatsApp</a>
      </div>
    </div>
    <div style="padding-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:40px 32px">
      <sc-for list="{{ cols }}" as="col" hint-placeholder-count="5">
        <div>
          <p style="margin:0 0 16px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#A8577A">{{ col.h }}</p>
          <div style="display:flex;flex-direction:column;gap:10px">
            <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="4">
              <a href="{{ l.href }}" style="font-size:14px;line-height:1.45;color:#C9B4BF" style-hover="color:#FBF7F4">{{ l.t }}</a>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <div>
        <p style="margin:0 0 16px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#A8577A">{{ ui.foot.address }}</p>
        <p style="margin:0;font-size:14px;line-height:1.7">Centro Médico Lucio Costa<br>Bloco I / T-56<br>SGAS 610/611, Via L2 Sul<br>Brasília-DF · 70200-700</p>
      </div>
    </div>
    <div style="margin:56px 0 0;padding-top:24px;border-top:1px solid rgba(240,231,226,0.12)"><p style="margin:0;max-width:90ch;font-size:12px;line-height:1.6;color:#9C8793">{{ notice }}</p></div>
    <div style="margin-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:12px;color:#9C8793">
      <span>{{ creds }}</span>
      <span>© 2026 Carine Petry. {{ rights }}</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'pt', d: null };
  componentDidMount() {
    const boot = () => { if (!window.CPData) return setTimeout(boot, 30); this.off = CPData.onLang(() => this.load()); this.load(); };
    boot();
  }
  componentWillUnmount() { this.off && this.off(); }
  async load() { const lang = CPData.getLang(); const d = await CPData.load(lang); const posts = await CPData.posts(lang); this.setState({ lang, d, posts }); }
  renderVals() {
    const { d, posts } = this.state;
    if (!d) return { ui: { foot: {} }, pages: {} };
    const P = CPData.PAGES, ui = d.ui, f = d.dict.footer;
    const cats = [...new Set((posts || []).map(p => p.category))];
    return {
      ui, pages: P, tagline: f.tagline, notice: f.medicalNotice, creds: f.credentials, rights: f.rights,
      cols: [
        { h: ui.foot.consult, links: [{ t: ui.nav.approach, href: P.approach }, { t: ui.nav.areas, href: P.areas }, { t: ui.nav.conds, href: P.conds }, ...d.dict.areasHome.items.map(a => ({ t: a.t, href: CPData.condHref(a.slug) }))] },
        { h: ui.foot.content, links: [{ t: ui.foot.allArticles, href: P.content }, ...cats.map(c => ({ t: c, href: P.content + '?cat=' + encodeURIComponent(c) }))] },
        { h: ui.foot.inst, links: [{ t: ui.nav.home, href: P.home }, { t: ui.nav.about, href: P.about }, { t: ui.nav.talks, href: P.talks }, { t: ui.nav.contact, href: P.contact }] },
        { h: ui.foot.contact, links: [{ t: '(61) 3263-7721', href: 'tel:+556132637721' }, { t: '(61) 99272-1947', href: 'https://wa.me/5561992721947' }, { t: 'contato@carinepetry.com.br', href: 'mailto:contato@carinepetry.com.br' }, { t: 'Instagram', href: 'https://www.instagram.com/dracarine.petry/' }] },
        { h: ui.foot.legal, links: [{ t: ui.foot.privacy, href: P.home + 'privacidade/' }, { t: ui.foot.terms, href: P.home + 'termos/' }] }
      ]
    };
  }
}
</script>
</body>
</html>
