<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palestras e aulas | Dra. Carine Petry</title>
<meta name="description" content="A Dra. Carine Petry participa de congressos, aulas e eventos para profissionais da saúde e para o público, levando ciência clara sobre quadros multissistêmicos.">
<meta name="theme-color" content="#241021">
<link rel="canonical" href="https://carinepetry.com.br/palestras/">
<link rel="alternate" hreflang="pt-BR" href="https://carinepetry.com.br/palestras/">
<link rel="alternate" hreflang="en" href="https://carinepetry.com.br/en/palestras/">
<link rel="alternate" hreflang="x-default" href="https://carinepetry.com.br/palestras/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dra. Carine Petry">
<meta property="og:title" content="Palestras e aulas | Dra. Carine Petry">
<meta property="og:description" content="A Dra. Carine Petry participa de congressos, aulas e eventos para profissionais da saúde e para o público, levando ciência clara sobre quadros multissistêmicos.">
<meta property="og:url" content="https://carinepetry.com.br/palestras/">

<script>window.CP_PARAMS={"lang":"pt","base":"../","alt":{"pt":"../palestras/","en":"../en/palestras/"}};window.CP_ASSETS="../assets/";window.__resources={"./SiteHeader.dc.html":"../assets/SiteHeader.dc.html","./SiteFooter.dc.html":"../assets/SiteFooter.dc.html"};</script>
<script src="../assets/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<script src="../assets/cp-content.js"></script>
<script src="../assets/cp-data.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FBF7F4;color:#3A3532;font-family:var(--sans,'Instrument Sans'),-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#8E1348;text-decoration:none}
a:hover{color:#B01755}
::selection{background:#4A1942;color:#FBF7F4}
</style>
</helmet>
<dc-import name="SiteHeader" current="talks" hint-size="100%,0px"></dc-import>
<main>
<section data-hero-dark="" data-screen-label="01 Palestras, abertura" style="background:#241021;color:#F0E7E2;padding:clamp(120px,14vw,168px) 0 0;position:relative;overflow:hidden">
  <div style="position:relative;max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <p style="margin:0 0 24px;font-size:15px;font-weight:500;color:#D08AA8">{{ ui.nav.talks }}</p>
    <h1 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(3.25rem,8vw,8rem);line-height:0.92;letter-spacing:-0.03em;color:#FBF7F4">{{ t.title }}</h1>
    <div style="margin-top:clamp(40px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:32px 64px;align-items:end">
      <p style="margin:0;max-width:48ch;font-size:clamp(17px,1.3vw,20px);line-height:1.6;color:#C9B4BF;text-wrap:pretty">{{ t.lead }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:flex-end">
        <a href="https://wa.me/5561992721947" style="display:inline-flex;align-items:center;height:52px;padding:0 28px;border-radius:999px;white-space:nowrap;background:#B01755;color:#FFFFFF;font-size:15px;font-weight:500" style-hover="background:#C51E60;color:#FFFFFF">{{ t.cta }}</a>
      </div>
    </div>
    <div style="height:clamp(72px,9vw,120px)"></div>
  </div>
</section>

<section data-screen-label="02 Temas" style="padding:clamp(96px,12vw,160px) 0">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <p data-reveal="" style="margin:0 0 20px;font-size:15px;font-weight:500;color:#8E1348">{{ t.themesTitle }}</p>
    <div style="border-bottom:1px solid #E2DAD3">
      <sc-for list="{{ themes }}" as="x" hint-placeholder-count="4">
        <div data-reveal="" style="display:grid;grid-template-columns:72px minmax(0,1.3fr) minmax(0,1fr);gap:12px 40px;padding:clamp(32px,4vw,48px) 0;border-top:1px solid #E2DAD3;align-items:baseline">
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;color:#A8577A">{{ x.n }}</span>
          <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(1.75rem,3vw,2.6rem);line-height:1.1;color:#241021;text-wrap:balance">{{ x.t }}</h2>
          <p style="margin:0;font-size:16px;line-height:1.62;text-wrap:pretty">{{ x.d }}</p>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<section data-screen-label="03 Formatos" style="background:#F4EEE9;padding:clamp(88px,10vw,136px) 0">
  <div data-reveal="" style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px clamp(48px,7vw,112px)">
    <p style="margin:0;font-size:15px;font-weight:500;color:#8E1348">{{ t.formatsTitle }}</p>
    <div style="grid-column:span 2;display:flex;flex-wrap:wrap;gap:10px">
      <sc-for list="{{ formats }}" as="f" hint-placeholder-count="5">
        <span style="display:inline-flex;align-items:center;min-height:52px;padding:0 24px;border-radius:999px;background:#FFFFFF;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.4rem;color:#241021">{{ f }}</span>
      </sc-for>
    </div>
  </div>
</section>

<section data-screen-label="04 Convite" style="padding:clamp(96px,12vw,160px) 0">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <div data-reveal="" style="padding:clamp(40px,6vw,88px);border-radius:32px;background:#241021;color:#F0E7E2;text-align:center">
      <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(2.5rem,5vw,4.25rem);line-height:1.04;color:#FBF7F4">{{ t.ctaTitle }}</h2>
      <p style="margin:24px auto 0;max-width:50ch;font-size:18px;line-height:1.6;color:#C9B4BF">{{ t.ctaLead }}</p>
      <a href="https://wa.me/5561992721947" style="display:inline-flex;margin-top:40px;align-items:center;height:52px;padding:0 28px;border-radius:999px;white-space:nowrap;background:#B01755;color:#FFFFFF;font-size:15px;font-weight:500" style-hover="background:#C51E60;color:#FFFFFF">{{ t.cta }}</a>
    </div>
  </div>
</section>
</main>
<dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { d: null };
  componentDidMount() {
    const boot = () => { if (!window.CPData) return setTimeout(boot, 30); this.off = CPData.onLang(() => this.load()); this.load(); };
    boot();
  }
  componentWillUnmount() { this.off && this.off(); }
  async load() { const d = await CPData.load(CPData.getLang()); this.setState({ d }, () => CPData.reveal()); }
  renderVals() {
    const { d } = this.state;
    if (!d) return { ui: { nav: {} }, t: {} };
    const t = d.dict.talks;
    return {
      ui: d.ui, t,
      themes: t.themes.map((x, i) => ({ ...x, n: String(i + 1).padStart(2, '0') })),
      formats: t.formats.replace(/\.$/, '').split(/,\s*(?:e |and )?|\s+e\s+|\s+and\s+/).filter(Boolean).map(s => s.charAt(0).toUpperCase() + s.slice(1))
    };
  }
}
</script>
</body>
</html>
